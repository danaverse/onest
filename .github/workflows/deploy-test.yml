name: Deploy to Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build packages and web app
        env:
          VITE_PUBLIC_SITE_ORIGIN: ${{ vars.VITE_PUBLIC_SITE_ORIGIN || 'https://test.onest.pet' }}
          VITE_PAW_TOKEN_ID: ${{ vars.VITE_PAW_TOKEN_ID || secrets.VITE_PAW_TOKEN_ID || '' }}
          VITE_PAW_TICKER: ${{ vars.VITE_PAW_TICKER || 'tPAW' }}
        run: |
          npm run build
          npm run web:build

      - name: Check required deployment secrets
        env:
          SSH_HOST: ${{ secrets.TEST_SSH_HOST || secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.TEST_SSH_USER || secrets.CONTABO_USER || 'deploy' }}
          SSH_KEY: ${{ secrets.TEST_SSH_KEY || secrets.CONTABO_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Missing TEST_SSH_HOST secret."
            missing=1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing TEST_SSH_KEY secret. An SSH private key is required for passwordless deployment."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deployment target: ${SSH_USER}@${SSH_HOST} (SSH key auth)"

      - name: Deploy to Test VM
        env:
          SSH_HOST: ${{ secrets.TEST_SSH_HOST || secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.TEST_SSH_USER || secrets.CONTABO_USER || 'deploy' }}
          SSH_PORT: ${{ secrets.TEST_SSH_PORT || secrets.CONTABO_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.TEST_SSH_KEY || secrets.CONTABO_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          WEB_DEST: ${{ vars.TEST_WEB_PATH || secrets.TEST_WEB_PATH || '/var/www/onest-test' }}
          REPO_DEST: ${{ vars.TEST_REPO_PATH || secrets.TEST_REPO_PATH || '/opt/onest' }}
          TEST_DESK_SEEDS: ${{ secrets.TEST_DESK_SEEDS }}
          SOFT_WAIT: ${{ vars.MINT_MIN_PRAY_SECONDS || '54' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Configure SSH private key authentication
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host key to known_hosts
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          echo "Ensuring remote directories exist..."
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p '${WEB_DEST}' '${REPO_DEST}'"

          echo "Deploying web app assets to ${WEB_DEST}..."
          rsync -avz --delete \
            -e "${RSYNC_SSH}" \
            apps/web/dist/ \
            "${SSH_USER}@${SSH_HOST}:${WEB_DEST}/"

          echo "Setting web directory permissions..."
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "chmod -R u+rwX,g+rX '${WEB_DEST}' 2>/dev/null || true"

          echo "Syncing repository code to ${REPO_DEST}..."
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'data' \
            --exclude 'dist' \
            --exclude 'apps/web/dist' \
            -e "${RSYNC_SSH}" \
            ./ \
            "${SSH_USER}@${SSH_HOST}:${REPO_DEST}/"

          echo "Updating backend code permissions..."
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "\
            sudo chown -R '${SSH_USER}:${SSH_USER}' '${REPO_DEST}' 2>/dev/null || true"

          echo "Installing backend dependencies on the VM (better-sqlite3, drizzle)..."
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "\
            cd '${REPO_DEST}' && npm ci --no-audit --no-fund"

          echo "Provisioning tPAW desk (never WLotus) from TEST_DESK_SEEDS..."
          if [ -z "$TEST_DESK_SEEDS" ]; then
            echo "::error::Missing TEST_DESK_SEEDS secret. The test desk cannot create tPAW without it."
            exit 1
          fi
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p /tmp && rm -f /tmp/onest-desk-seed"
          printf '%s\n' "$TEST_DESK_SEEDS" | $SSH_CMD "${SSH_USER}@${SSH_HOST}" "cat > /tmp/onest-desk-seed && chmod 600 /tmp/onest-desk-seed"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "\
            sudo chmod +x '${REPO_DEST}/scripts/provision-test-tpaw.sh' '${REPO_DEST}/deploy/contabo/run-mint-api.sh' '${REPO_DEST}/deploy/contabo/run-dana-index.sh' && \
            sudo env \
              TEST_DESK_SEEDS=\"\$(sudo cat /tmp/onest-desk-seed)\" \
              REPO_DEST='${REPO_DEST}' \
              WEB_DEST='${WEB_DEST}' \
              MINT_MIN_PRAY_SECONDS='${SOFT_WAIT}' \
              PUBLIC_SITE_ORIGIN='https://test.onest.pet' \
              bash '${REPO_DEST}/scripts/provision-test-tpaw.sh' && \
            sudo rm -f /tmp/onest-desk-seed"

          # Clean up private key from runner
          rm -f ~/.ssh/deploy_key

          echo "Deployment complete."

      - name: Verify Live Deployment (Smoke Check)
        env:
          SMOKE_URL: ${{ vars.TEST_SMOKE_URL || secrets.TEST_SMOKE_URL || 'https://test.onest.pet' }}
        run: |
          echo "Running smoke check against ${SMOKE_URL}..."
          for i in {1..8}; do
            html_ok=0
            api_ok=0
            if curl -fsSL --retry 2 --retry-delay 2 "${SMOKE_URL}" | grep -q "Loving Animal Memories"; then
              html_ok=1
            fi
            status="$(curl -fsSL --retry 2 --retry-delay 2 "${SMOKE_URL}/api/status" || true)"
            ticker="$(printf '%s' "$status" | sed -n 's/.*"ticker":"\([^"]*\)".*/\1/p')"
            if printf '%s' "$status" | grep -q 'wlotus-mint-api\|"ticker":"WLOTUS"'; then
              echo "::error::test.onest.pet is still serving WLotus. Abort."
              exit 1
            fi
            if [ "$ticker" = "tPAW" ]; then
              api_ok=1
            fi
            if [ "$html_ok" -eq 1 ] && [ "$api_ok" -eq 1 ]; then
              echo "Smoke check passed: ${SMOKE_URL} is live on tPAW (not WLotus)."
              exit 0
            fi
            echo "Waiting for live update... ($i/8) html_ok=$html_ok ticker=${ticker:-none}"
            sleep 5
          done
          echo "::error::Smoke check failed: expected Onest HTML + /api/status ticker tPAW at ${SMOKE_URL}"
          exit 1
