# Extra locations for the Onest HTTPS server block.
# Exact `location =` wins over prefix `location /api/` / `/index-api/`.
# Do NOT include wlotus-hardening.conf here — that snippet pins
# /api/challenge to WLotus :8787.

    location = /api/challenge {
        limit_req zone=wl_challenge burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /api/submit {
        limit_req zone=onest_submit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /api/burn {
        limit_req zone=onest_burn burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location ~ ^/api/(profile|post|vote)/create$ {
        limit_req zone=onest_paid burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /api/notify {
        default_type application/json;
        return 403 '{"ok":false,"error":"notify is not public"}';
    }

    location = /index-api/api/notify {
        default_type application/json;
        return 403 '{"ok":false,"error":"notify is not public"}';
    }
