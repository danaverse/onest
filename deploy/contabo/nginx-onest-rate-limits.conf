# http-context rate limit zones for Onest mint-api (install into /etc/nginx/conf.d/).
# wl_challenge is defined separately (wlotus-rate-limit.conf on shared VMs).
# Reload: nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=onest_submit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=onest_burn:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=onest_paid:10m rate=30r/m;
