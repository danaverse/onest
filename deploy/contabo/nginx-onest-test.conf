server {
    listen 80;
    listen [::]:80;
    server_name test.onest.pet onest.pet;

    location /.well-known/acme-challenge/ {
        root /var/www/onest-test;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.onest.pet onest.pet;

    ssl_certificate     /etc/letsencrypt/live/test.onest.pet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.onest.pet/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/onest-security-headers.conf;

    root /var/www/onest-test;
    index index.html;

    include /etc/nginx/snippets/onest-hardening.conf;

    # Onest mint-api (dedicated port; WLotus stays on 8787)
    location /api/ {
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Onest dana-index (dedicated port; WLotus stays on 8788)
    location /index-api/ {
        proxy_pass http://127.0.0.1:9788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location ~* "^/og/([0-9a-fA-F]{64})/?$" {
        proxy_pass http://127.0.0.1:9788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location ~* "^/([0-9a-fA-F]{64})/?$" {
        error_page 502 503 504 = @onest_spa;
        proxy_pass http://127.0.0.1:9788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 120s;
    }

    location @onest_spa {
        try_files /index.html =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9787;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/onest-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/onest-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/onest-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/onest-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
